name: Claim Heads B2B Lead Autopilot

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-Platform Lead Scraper
        run: python scraper_worker.py
